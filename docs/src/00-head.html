<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nozila — Rebuild Specification</title>
<style>
  @page {
    size: A4;
    margin: 18mm 16mm 20mm 16mm;
    @bottom-center { content: counter(page); }
  }

  :root{
    --ink:#12161f;
    --ink-2:#3c4657;
    --ink-3:#6b7688;
    --line:#dfe4ec;
    --line-2:#eef1f6;
    --bg-soft:#f7f9fc;
    --accent:#3b4fd8;
    --accent-soft:#eef0fe;
    --accent-2:#0d9488;
    --amber:#b4690e;
    --amber-soft:#fdf6e9;
    --rose:#b42318;
    --rose-soft:#fdf0ef;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono","Cascadia Mono",Consolas,monospace;
    --sans:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    font-size:9.6pt;
    line-height:1.55;
    margin:0;
  }

  /* ---------- cover ---------- */
  .cover{
    page-break-after:always;
    height:245mm;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:6mm 0 0 0;
  }
  .cover-mark{
    display:flex;align-items:center;gap:9px;
    font-size:8.2pt;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-3);font-weight:600;
  }
  .cover-mark .glyph{
    width:26px;height:26px;border:1.6px solid var(--accent);border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);font-size:12pt;font-weight:700;letter-spacing:0;
  }
  .cover-body h1{
    font-size:41pt;line-height:1.03;margin:0 0 10px;letter-spacing:-.028em;font-weight:800;
  }
  .cover-body h1 .thin{font-weight:300;color:var(--ink-2);display:block;font-size:28pt;letter-spacing:-.02em;margin-top:6px;}
  .cover-rule{height:3px;width:70px;background:var(--accent);margin:20px 0 16px;border-radius:2px;}
  .cover-lede{font-size:11.4pt;line-height:1.5;color:var(--ink-2);max-width:132mm;margin:0 0 26px;}
  .cover-meta{
    display:grid;grid-template-columns:repeat(3,1fr);gap:0;
    border-top:1px solid var(--line);padding-top:12px;
  }
  .cover-meta div{padding-right:10px;}
  .cover-meta dt{font-size:7.4pt;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:3px;}
  .cover-meta dd{margin:0;font-size:9.3pt;color:var(--ink);font-weight:500;}
  .cover-foot{
    border-top:1px solid var(--line);padding-top:9px;
    font-size:7.8pt;color:var(--ink-3);display:flex;justify-content:space-between;
  }

  /* ---------- structure ---------- */
  h2{
    font-size:17pt;letter-spacing:-.018em;margin:0 0 4px;font-weight:750;
    page-break-after:avoid;
  }
  .sec{page-break-before:always;}
  .sec-head{border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:16px;}
  .sec-num{
    font-family:var(--mono);font-size:8pt;color:var(--accent);font-weight:700;
    letter-spacing:.1em;display:block;margin-bottom:3px;
  }
  .sec-sub{color:var(--ink-3);font-size:9pt;margin:2px 0 0;}

  h3{
    font-size:11.6pt;margin:18px 0 6px;font-weight:700;letter-spacing:-.01em;
    page-break-after:avoid;
  }
  h4{
    font-size:9.9pt;margin:13px 0 4px;font-weight:700;color:var(--ink);
    page-break-after:avoid;
  }
  h5{
    font-size:8.2pt;margin:11px 0 4px;font-weight:700;color:var(--ink-3);
    letter-spacing:.09em;text-transform:uppercase;page-break-after:avoid;
  }
  p{margin:0 0 7px;}
  ul,ol{margin:0 0 8px;padding-left:16px;}
  li{margin-bottom:2.5px;}
  li::marker{color:var(--ink-3);}
  strong{font-weight:650;}
  a{color:var(--accent);text-decoration:none;}

  code{
    font-family:var(--mono);font-size:8.3pt;
    background:var(--bg-soft);border:1px solid var(--line-2);
    padding:.5px 3.5px;border-radius:3px;color:var(--ink);
    white-space:nowrap;
  }
  pre{
    font-family:var(--mono);font-size:7.9pt;line-height:1.5;
    background:#0f1420;color:#dbe2f0;border-radius:6px;
    padding:9px 11px;overflow-x:auto;margin:0 0 10px;
    page-break-inside:avoid;
  }
  pre code{background:none;border:none;padding:0;color:inherit;white-space:pre;}
  pre .k{color:#7dd3fc;} pre .s{color:#a5e8a5;} pre .c{color:#7b8494;font-style:italic;}
  pre .t{color:#f0b980;} pre .n{color:#e3a9f5;}

  /* ---------- tables ---------- */
  table{
    width:100%;border-collapse:collapse;margin:0 0 11px;
    font-size:8.4pt;page-break-inside:auto;
  }
  thead{display:table-header-group;}
  tr{page-break-inside:avoid;}
  th{
    text-align:left;font-weight:700;font-size:7.4pt;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-3);
    border-bottom:1.4px solid var(--ink);padding:5px 7px 5px 0;vertical-align:bottom;
  }
  td{
    padding:5px 7px 5px 0;border-bottom:1px solid var(--line-2);vertical-align:top;
  }
  td code{font-size:7.8pt;white-space:normal;}
  table.tight td,table.tight th{padding:3.5px 6px 3.5px 0;}
  .num{text-align:right;font-family:var(--mono);white-space:nowrap;}
  .meth{
    font-family:var(--mono);font-size:7.2pt;font-weight:700;
    padding:1px 4px;border-radius:3px;letter-spacing:.02em;
  }
  .m-get{background:#e6f2ff;color:#0b5cad;}
  .m-post{background:#e6f6ec;color:#136c37;}
  .m-put{background:#fdf3e3;color:#8a5a06;}
  .m-patch{background:#f5edfd;color:#6b32a8;}
  .m-del{background:#fdeceb;color:#a02318;}

  /* ---------- callouts ---------- */
  .box{
    border-left:3px solid var(--accent);background:var(--accent-soft);
    padding:8px 11px;margin:0 0 11px;border-radius:0 5px 5px 0;
    page-break-inside:avoid;
  }
  .box.warn{border-left-color:var(--amber);background:var(--amber-soft);}
  .box.risk{border-left-color:var(--rose);background:var(--rose-soft);}
  .box.fact{border-left-color:var(--accent-2);background:#eaf7f5;}
  .box p:last-child{margin-bottom:0;}
  .box .lab{
    font-size:7.2pt;letter-spacing:.12em;text-transform:uppercase;font-weight:750;
    color:var(--accent);margin-bottom:3px;display:block;
  }
  .box.warn .lab{color:var(--amber);}
  .box.risk .lab{color:var(--rose);}
  .box.fact .lab{color:var(--accent-2);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px;}

  .card{
    border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin:0 0 10px;
    page-break-inside:avoid;
  }
  .card h4{margin-top:0;}

  .kv{font-size:8.4pt;margin:0 0 9px;}
  .kv div{display:flex;gap:7px;padding:2.5px 0;border-bottom:1px solid var(--line-2);}
  .kv b{flex:0 0 40mm;font-weight:600;color:var(--ink-2);}

  .pill{
    display:inline-block;font-size:7.2pt;font-weight:700;letter-spacing:.05em;
    padding:1.5px 6px;border-radius:20px;text-transform:uppercase;
  }
  .p-free{background:#eef1f6;color:#4a5568;}
  .p-plus{background:#e6f2ff;color:#0b5cad;}
  .p-pro{background:#f0ebfd;color:#5b32b8;}
  .p-admin{background:#fdeceb;color:#a02318;}
  .p-ok{background:#e6f6ec;color:#136c37;}

  .toc{font-size:9pt;}
  .toc ol{list-style:none;padding:0;margin:0;counter-reset:t;}
  .toc > ol > li{
    counter-increment:t;display:flex;gap:9px;padding:4.5px 0;
    border-bottom:1px solid var(--line-2);align-items:baseline;
  }
  .toc > ol > li::before{
    content:counter(t,decimal-leading-zero);
    font-family:var(--mono);font-size:7.6pt;color:var(--accent);font-weight:700;
    flex:0 0 15px;
  }
  .toc .t-name{font-weight:640;flex:0 0 62mm;}
  .toc .t-desc{color:var(--ink-3);font-size:8.2pt;flex:1;}

  figure{margin:0 0 12px;page-break-inside:avoid;}
  figure img{width:100%;border:1px solid var(--line);border-radius:5px;display:block;}
  figcaption{font-size:7.6pt;color:var(--ink-3);margin-top:4px;line-height:1.4;}
  .fig2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .fig2 figure{margin:0;}

  .ascii{
    font-family:var(--mono);font-size:7.1pt;line-height:1.32;
    background:var(--bg-soft);border:1px solid var(--line);border-radius:6px;
    padding:9px 11px;margin:0 0 11px;white-space:pre;overflow-x:auto;
    page-break-inside:avoid;color:var(--ink-2);
  }

  .lede{font-size:10.2pt;color:var(--ink-2);margin-bottom:12px;line-height:1.5;}
  .avoid{page-break-inside:avoid;}
  .src{font-size:7.4pt;color:var(--ink-3);font-style:italic;margin:-4px 0 10px;}
</style>
</head>
<body>
