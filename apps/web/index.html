<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0072FD" />
    <meta
      name="description"
      content="Novira is the spatial design platform for events, exhibitions and stages — plan in 3D, price it as you draw, and ship drawings a workshop can build from."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!--
      The icons, in the order a browser prefers them. The SVG is the drawn mark
      and scales to any tab; the PNGs are for the places that will not take one
      — an Android home screen, an older Safari, a bookmark bar.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      What a link to Novira looks like when it is pasted into Slack, WhatsApp or
      LinkedIn. Absolute URLs are required by every one of those crawlers, and
      the file is 1200 × 630 because that is the one ratio they all crop to.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Novira" />
    <meta property="og:title" content="Novira — Design events in 3D" />
    <meta
      property="og:description"
      content="Plan in 3D, price it as you draw, and ship drawings a workshop can build from."
    />
    <meta property="og:image" content="/app/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/app/og-card.jpg" />

    <title>Novira — Design events in 3D</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
